---
name: Question
description: Ask how bitcoin-node-tests does something, or why it does it that way
labels: [question]

body:
  - type: markdown
    attributes:
      value: >
        Discussions are not enabled here, so a question is an issue: this
        form is what keeps one from having to be filed as a bug. The
        [README](https://github.com/btclib-org/bitcoin-node-tests/blob/main/README.md)
        comes first, and for a real-time answer there is the Slack
        channel behind the *Chat with the developers* link on the
        new-issue page.

  - type: textarea
    id: question
    attributes:
      label: The question
      description: >
        What you are trying to do, and what you have already read or
        tried.
    validations:
      required: true
