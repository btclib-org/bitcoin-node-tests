---
name: node-integration

# Step 3 of issue btclib-org/btclib#2220: `tests/integration/` reaches a
# real node over a process, an RPC socket and a p2p socket, and this is
# where that happens against something that is not this laptop. bitcoind
# is the oracle (rule 3) and `bitcoind`, below, is the ordinary gate: the
# reusable job btclib already calls, `reusable-integration-bitcoind.yml`,
# installs the pinned release and fails the run if its own tests did not
# run. `btclib-node` asks the same question of the target, its failing
# tests weighed against `TF2.md`'s own `btclib-node` column rather than
# counted, and it reports rather than gates: `continue-on-error: true`,
# and no branch rule reads its check. It installs btclib-node's latest
# release unpinned, so a new release moving one of that column's cells
# turns it red with no pull request here having changed anything, and
# ISS 8's decision below keeps bitcoind's pinned release the only
# required check.
#
# No `schedule:`: section 10 of the organization standard's own record,
# *Which trees carry which sentinel*, does not name this repository
# against the `integration-bitcoind` row, so a cron here would be a row
# the calendar gives nobody, exactly the finding
# `tests/grid_test.py::test_every_row_of_the_calendar_names_something_that_exists`
# is for. Every trigger below is a gate's rather than a sentinel's, so
# `tests/grid_test.py::schedules` never sees this file at all: an
# ordinary pull request already asks bitcoind the question, which is
# most of what a weekly repeat would buy.
#
# `btclib-node` is not a dependency of this project's own environment,
# for the reasons `pyproject.toml`'s comment on `[dependency-groups]`
# gives. So each job running it sets up a second interpreter of its own,
# the one its `Setup a second interpreter for btclib-node` step names,
# installs `btclib-node` into that one alone, and points
# `tests/integration/conftest.py`'s `TF2_BTCLIB_NODE_PYTHON` at it --
# never at the interpreter running `pytest` itself.
#
# `btclib-node` and `btclib-node-main` also install the same pinned
# `bitcoind` the job above does, and set `TF2_BITCOIND` from it (issue
# bitcoin-node-tests#61): without one,
# `mixed_cluster_block_sync_btclib_node_test.py` -- the "most valuable
# case" of ISS 43, needing both nodes at once -- skips on every job that
# runs `*_btclib_node_test.py`, `bitcoind`'s own `skip-reason-prefix`
# exempting it there. Both install it with btclib-org/.github's own
# `.github/scripts/install_bitcoind.py`, the script
# `reusable-integration-bitcoind.yml` runs for `bitcoind`, served the way
# that workflow serves it: a sparse checkout of that repository at `main`
# beside this tree, `main` being the trust `bitcoind` already extends by
# calling that workflow `@main`.
#
# `core-master` and `btclib-node-main` are ISS 8's decision of
# 2026-09-25: the pinned release stays the only required check -- a
# required check depending on a moving upstream would fail this
# repository's pull requests for reasons outside them -- and each target
# gains an informational counterpart tracking its own default branch,
# `continue-on-error: true` and read by no branch rule, exactly
# `btclib-node`'s own shape above. Both live in this file rather than one
# of their own: they are two more verdicts on the same
# `tests/integration` suite the two jobs above already run, sharing this
# file's trigger set, its concurrency group and (for `core-master`) the
# `bitcoind` job's own report, none of which a separate workflow could
# read without a second checkout and a second artifact download.
#
# Both are job-level `if: github.event_name != 'pull_request'`, on the
# same trigger set as the jobs above: a pull request already runs
# `bitcoind` and `btclib-node` against it, and a job built from
# Bitcoin Core's own `master` would fail a pull request for a reason the
# diff never touched. Push to `main` and `workflow_dispatch` are what the
# issue asks for; a `schedule:` is not -- section 10 of the organization
# standard's own calendar does not name this repository against either
# job, so a cron here would be a row the calendar gives nobody, the
# finding `tests/grid_test.py::schedules` exists for, exactly as the
# header above already argues for `bitcoind` and `btclib-node`.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# the pinned bitcoind for every job that installs its own: the
# `bitcoind` job's `with:` below names the same pair, a `workflow_call`
# job's `with:` having no `env` context to read these from
env:
  BITCOIND_VERSION: "31.1"
  BITCOIND_SHA256: >-
    b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e

jobs:
  bitcoind:
    uses: btclib-org/.github/.github/workflows/reusable-integration-bitcoind.yml@main
    permissions:
      contents: read
    with:
      # the release under test, and the sha256 of its linux tarball as
      # the independent guix builders attested it in
      # bitcoin-core/guix.sigs -- matching btclib's own pin, both trees
      # testing against the same oracle
      bitcoind-version: "31.1"
      bitcoind-sha256: >-
        b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
      # tests/integration/conftest.py's own two switches
      integration-env-var: TF2_INTEGRATION
      bitcoind-path-env-var: TF2_BITCOIND
      # this job's own environment has no btclib-node interpreter to
      # point TF2_BTCLIB_NODE_PYTHON at, so every test asking for one
      # skips here rather than running -- a legitimate skip the reusable
      # job's own "did the node tests run" check would otherwise flag.
      # The prefix is the message tests/integration/conftest.py's
      # `btclib_node_python` skips with, so it exempts that skip whatever
      # module it happens in, and every other skip still fails the job
      skip-reason-prefix: "no btclib_node importable by "

  btclib-node:
    name: Regtest against btclib-node
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # a moved `TF2.md` cell here is a finding for the ledger or for
    # btclib-node's own tracker, not a defect of this repository's own
    # gates, so this job reports without blocking a merge -- rule 3's "a
    # disagreement is a result, not a failure of the suite"
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Setup a second interpreter for btclib-node
        id: btclib-node-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install btclib-node into it
        env:
          BTCLIB_NODE_PYTHON: ${{ steps.btclib-node-python.outputs.python-path }}
        run: |
          "$BTCLIB_NODE_PYTHON" -m pip install --disable-pip-version-check btclib-node
      # beside this tree's own checkout rather than over it: `path:` is
      # what keeps the two apart, and the header above has why `main`
      - name: Check out btclib-org/.github's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: btclib-org/.github
          ref: main
          path: standard
          persist-credentials: false
          sparse-checkout: .github/scripts
      # the workflow's own pin, so the mixed cluster is tested against
      # the same oracle everything else in this file is. The script takes
      # the standard library alone, so `--no-project` runs it on the
      # interpreter uv fetches rather than on this tree's own
      # environment, and it prints the daemon's path and nothing else
      - name: Install bitcoind
        id: bitcoind
        run: |
          daemon=$(uv run --no-project --python 3.15 \
            standard/.github/scripts/install_bitcoind.py \
            "$BITCOIND_VERSION" "$BITCOIND_SHA256")
          echo "path=$daemon" >> "$GITHUB_OUTPUT"
          "$daemon" -version | head -n 1
      # continue-on-error: a TF2.md row that fails on btclib-node fails
      # pytest on every run, so pytest's own status would colour this job
      # the same whether anything changed or not. The two steps after it
      # are what colour the job instead
      - name: Run the integration tests against btclib-node
        continue-on-error: true
        env:
          BTCLIB_NODE_PYTHON: ${{ steps.btclib-node-python.outputs.python-path }}
          BITCOIND_PATH: ${{ steps.bitcoind.outputs.path }}
        run: |
          export TF2_INTEGRATION=1
          export TF2_BTCLIB_NODE_PYTHON="$BTCLIB_NODE_PYTHON"
          export TF2_BITCOIND="$BITCOIND_PATH"
          uv run --locked --no-default-groups --group test \
            pytest tests/integration/*_btclib_node_test.py \
            --junitxml=integration.xml
      # the `bitcoind` job's own "did the node tests run" question, asked
      # here with capability skips exempted -- the script's docstring has
      # why. It colours this job and not the run: the job's
      # `continue-on-error` covers every step of it, and whether these
      # jobs gate anything is ISS 8's decision
      - name: Fail if the node tests did not run
        if: ${{ !cancelled() }}
        run: |
          uv run --locked --no-default-groups --group test \
            python .github/scripts/check_node_ran.py integration.xml
      # each TF2.md row's btclib-node verdict for the released build
      # against this report; it fails where any row moved, the script's
      # docstring having why. !cancelled(): a failing check above does not
      # skip it. `tee` writes the report to the log as well as the summary,
      # the log being what `gh run view --log` reads, and `pipefail` keeps
      # the script's own status as the step's rather than `tee`'s
      - name: Compare the report with TF2.md
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          uv run --locked --no-default-groups --group test \
            python .github/scripts/btclib_node_verdict.py \
            TF2.md integration.xml release | tee -a "$GITHUB_STEP_SUMMARY"

  core-master:
    name: Regtest against Core built from master
    needs: bitcoind
    # !cancelled() rather than the implicit success(): a build that only
    # asks "does this still hold on master" is worth running even where
    # the pinned job itself failed, and reusable-integration-bitcoind.yml
    # uploads its own report with `if: always()`, so the artifact this
    # job downloads below exists either way
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # a from-source Core build is minutes rather than the seconds the
    # jobs above spend on an installed binary; ccache is what a later
    # run reuses of this one's, never what this one gains from itself
    timeout-minutes: 60
    continue-on-error: true
    env:
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: bitcoin-node-tests
      # a second checkout beside the first, never over it: this job
      # reads two repositories, and `bitcoin-node-tests`' own tests
      # import from a package the shared workspace's PATH already knows,
      # nothing here changing how that resolves
      - name: Checkout Bitcoin Core at master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitcoin/bitcoin
          ref: master
          persist-credentials: false
          path: bitcoin-core
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # build-essential, cmake and python3 are already on the image;
      # libboost-dev is doc/build-unix.md's own "Required build
      # dependencies" column for Debian/Ubuntu, at master, and ccache is
      # what -DWITH_CCACHE=ON (the default) asks the build to find.
      # libsqlite3-dev is that same column's "SQLite (wallet)" one --
      # ENABLE_WALLET stays on below, `Capability.MINE`'s own
      # `BitcoindAdapter.mine` needing `createwallet` to fund
      # `generatetoaddress`, measured live against a build configured
      # without it: every `*_bitcoind_test.py` asking for `MINE` failed
      # on "createwallet ... Method not found" rather than on anything
      # this suite means to test
      - name: Install the build's own dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            libboost-dev libsqlite3-dev ccache
      # restore and save are separate steps: actions/cache's own post
      # step runs only on success(), so a run whose tests fail -- the
      # run this job exists for -- would save nothing. Keyed on this run
      # alone; restore-keys' prefix match is what a later master sha
      # reuses -- the latest saved run's own cache, ccache telling old
      # objects from the new sha's by content hash rather than by path
      # or mtime
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.ccache
          key: core-master-ccache-${{ github.run_id }}
          restore-keys: |
            core-master-ccache-
      - name: Record the resolved commit
        id: core-commit
        working-directory: bitcoin-core
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # CMakeLists.txt at master, read for this call: BUILD_GUI is OFF by
      # default already and named for the record; ENABLE_WALLET stays on
      # -- the comment above says why -- and BUILD_TESTS (which BUILD_TX
      # and BUILD_UTIL default from), BUILD_BENCH and BUILD_FUZZ_BINARY
      # are turned off because nothing this suite asks for needs Core's
      # own unit tests, a benchmark binary or a fuzz target; ENABLE_IPC
      # is turned off because it is ON by default on Linux and pulls in
      # libmultiprocess's own build (and, unpackaged, Cap'n Proto) for a
      # second `bitcoin-node` executable this suite never starts
      - name: Configure the build
        working-directory: bitcoin-core
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_CCACHE=ON
      - name: Build bitcoind
        id: build
        working-directory: bitcoin-core
        run: |
          start=$(date +%s)
          cmake --build build -j"$(nproc)" --target bitcoind
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      # right after the build and whatever its outcome: a partial build's
      # objects are still objects a later run need not compile again
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.ccache
          key: core-master-ccache-${{ github.run_id }}
      # always(): the wall time and the cache statistics are what this
      # job exists to record even where the build itself failed, and
      # they are what lets a later reading tell a cold run from a warm one
      - name: Record the build's own cost
        if: always()
        env:
          CORE_SHA: ${{ steps.core-commit.outputs.sha }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
        run: |
          {
            echo "### Core built from \`$CORE_SHA\`"
            echo
            echo "Build wall time: ${BUILD_SECONDS}s"
            echo
            echo '```text'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # the bitcoind-only half of the suite alone: this job asks whether
      # Core's own behaviour still matches TF2.md's pins, a question
      # `*_btclib_node_test.py` cannot answer either way
      - name: Run the integration tests against Core master
        working-directory: bitcoin-node-tests
        env:
          TF2_INTEGRATION: "1"
          TF2_BITCOIND: ${{ github.workspace }}/bitcoin-core/build/bin/bitcoind
        run: |
          uv run --locked --no-default-groups --group test \
            pytest tests/integration/*_bitcoind_test.py --junitxml=../master.xml
      # the pinned release's own report, from the required job above, in
      # the same workflow run: an artifact is shared by the run rather
      # than by the job that uploaded it, so `needs: bitcoind` is what
      # orders this after it exists rather than what makes it reachable.
      # always(): a failing pytest step above must not skip the
      # classification that follows
      - name: Download the pinned release's own report
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-report
          path: pinned-report
      - name: Classify a failure unique to master
        if: always()
        working-directory: bitcoin-node-tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/tf2_master_verdict.py \
            TF2.md ../master.xml ../pinned-report/integration.xml \
            >> "$GITHUB_STEP_SUMMARY"

  btclib-node-main:
    name: Regtest against btclib-node's main
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Setup a second interpreter for btclib-node
        id: btclib-node-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # git+...@main rather than the PyPI release the job above installs:
      # this job's own counterpart question is whether btclib-node's own
      # default branch still holds, not its last published version
      - name: Install btclib-node's main into it
        id: btclib-node-commit
        env:
          BTCLIB_NODE_PYTHON: ${{ steps.btclib-node-python.outputs.python-path }}
        run: |
          "$BTCLIB_NODE_PYTHON" -m pip install --disable-pip-version-check \
            "git+https://github.com/btclib-org/btclib-node@main"
          sha=$("$BTCLIB_NODE_PYTHON" -c '
          import importlib.metadata, json
          direct_url = importlib.metadata.distribution("btclib-node").read_text(
              "direct_url.json"
          )
          print(json.loads(direct_url)["vcs_info"]["commit_id"])
          ')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### btclib-node built from \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
      # `btclib-node`'s own two steps above
      - name: Check out btclib-org/.github's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: btclib-org/.github
          ref: main
          path: standard
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Install bitcoind
        id: bitcoind
        run: |
          daemon=$(uv run --no-project --python 3.15 \
            standard/.github/scripts/install_bitcoind.py \
            "$BITCOIND_VERSION" "$BITCOIND_SHA256")
          echo "path=$daemon" >> "$GITHUB_OUTPUT"
          "$daemon" -version | head -n 1
      # continue-on-error: `btclib-node`'s own step above has why
      - name: Run the integration tests against btclib-node's main
        continue-on-error: true
        env:
          BTCLIB_NODE_PYTHON: ${{ steps.btclib-node-python.outputs.python-path }}
          BITCOIND_PATH: ${{ steps.bitcoind.outputs.path }}
        run: |
          export TF2_INTEGRATION=1
          export TF2_BTCLIB_NODE_PYTHON="$BTCLIB_NODE_PYTHON"
          export TF2_BITCOIND="$BITCOIND_PATH"
          uv run --locked --no-default-groups --group test \
            pytest tests/integration/*_btclib_node_test.py \
            --junitxml=integration.xml
      # `btclib-node`'s own step above, over this job's own report
      - name: Fail if the node tests did not run
        if: ${{ !cancelled() }}
        run: |
          uv run --locked --no-default-groups --group test \
            python .github/scripts/check_node_ran.py integration.xml
      # `btclib-node`'s own step above, against each cell's verdict for a
      # build past every issue it names
      - name: Compare the report with TF2.md
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          uv run --locked --no-default-groups --group test \
            python .github/scripts/btclib_node_verdict.py \
            TF2.md integration.xml main | tee -a "$GITHUB_STEP_SUMMARY"
