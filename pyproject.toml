# The configuration of every tool that can be configured in one file.

[build-system]
# the floor is where the sdist's own pyproject.toml becomes a normalized
# copy of this file with the verbatim one kept beside it as
# pyproject.toml.orig; the ceiling is the next minor, this backend
# releasing with uv and versioned by it
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "bitcoin-node-tests"
# a placeholder, and the reason is CONTRIBUTING.md's "A version, and no
# release": nothing here is released yet (issue btclib-org/btclib#2220,
# step 2 of 5). Section 12's calendar versioning applies to what a
# release publishes, from step 4 on
version = "0"
description = "Bitcoin Core's functional test suite, rewritten on btclib, run against any node that speaks bitcoin's RPC and p2p"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "The btclib developers", email = "devs@btclib.org" }]
# Departs from section 1's application rule (`.python-version` the
# newest a dependency allows) and from btclib-org/.github#1324 (every
# tree moves to 3.15 ahead of its release), by the maintainer's own
# decision on issue bitcoin-node-tests#36: a Core developer runs this
# suite with whatever Python they already have, and a release candidate
# is one more interpreter to install for no dependency's sake. Measured
# against this tree's own code and every dependency `uv.lock` resolves:
# `typing.override` (PEP 698, used throughout the adapter) needs 3.12,
# and so does `sphinx`, the tightest floor any group carries -- btclib
# and bitcoin-core-rpc both allow back to 3.10, and nothing else in
# `dev` asks for more than 3.12. `.python-version` and requires-python
# still name the same release, this tree still running on one
# interpreter (section 1); that interpreter is now the lowest one every
# dependency and this tree's own syntax allow, not the newest one a
# release candidate offers.
requires-python = ">=3.12"
dependencies = [
    # the two packages tf2 imports, and no third: it reaches a node over
    # a socket, never through an in-process import (issue
    # btclib-org/btclib#2220, rule 1)
    "btclib>=2026.9.24",
    "bitcoin-core-rpc>=2026.9.24",
]
keywords = [
    # by relevance rather than alphabetical: PyPI shows keywords as they
    # are given, and the first few are read as what the package is
    "bitcoin",
    "bitcoin-core",
    "conformance-testing",
    "functional-tests",
    "p2p",
    "rpc",
]
classifiers = [
    # not a library (section 1): no `Topic :: Software Development ::
    # Libraries :: Python Modules`, and one interpreter rather than a
    # window
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
# no `documentation` and no `changelog`: this tree publishes nothing yet,
# no site stands behind it, and `changelog` is the name a publisher here
# gives `RELEASE_NOTES.md`, which section 2 gives a tier-1 tree alone
# (section 3). `homepage` and `download` have a referent regardless: a
# releasing tree's `homepage` is its own documentation site, and this
# tree has none of its own, so its home is the organization's own site,
# the same choice btclib-benchmarks makes for the same reason -- and
# `repository` below already carries this repository's own page, which a
# reader following the *About* link is already looking at
homepage = "https://btclib.org"
download = "https://github.com/btclib-org/bitcoin-node-tests/releases"
repository = "https://github.com/btclib-org/bitcoin-node-tests"
issues = "https://github.com/btclib-org/bitcoin-node-tests/issues"
pull_requests = "https://github.com/btclib-org/bitcoin-node-tests/pulls"

[dependency-groups]
harness = [
    "coverage>=7.16.0",
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]
test = [{ include-group = "harness" }]
lint = ["mypy>=2.3.1", "pre-commit>=4.6.2", "ruff>=0.16.7"]
# what inspects the distribution before it would be published -- and
# here nothing is published, so this is a lint of the packaging. Named
# `check`, not `build`, the name section 1 of btclib-org/.github keeps
# for the tools that build a distribution and the wheel repairers
check = [
    "pyroma>=5.0.1",
    # pyroma builds the project it is pointed at to read its metadata,
    # and asks `build` to do it without isolation first, which imports
    # the backend out of this environment. Absent from it, the build
    # falls back to an isolated one that resolves [build-system]'s
    # requires from an index. This is that requirement's uv_build, and
    # .pre-commit-config.yaml's own pyroma hook is what section 12 of
    # the organization standard asks for: a hook building the project
    # uses a backend [build-system] admits
    "uv_build>=0.12.0,<0.13",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
]
# btclib-node is not a dependency group of this project. Against this
# tree's former `requires-python = ">=3.15"`, measured live, `uv sync`
# resolving it failed outright: `rocksdict`, btclib-node's own
# dependency, shipped no `cp315` wheel. That specific incompatibility is
# gone now that requires-python reads ">=3.12" -- rocksdict ships a
# `cp312` wheel, measured against its own PyPI listing -- but the
# separation stays regardless: `tests/integration/conftest.py`'s
# `btclib_node_python` fixture names an interpreter of its own
# (`TF2_BTCLIB_NODE_PYTHON`) rather than this environment, so a
# contributor who never touches `tests/integration` against btclib-node
# never installs its compiled dependency either. Whether the two should
# share one environment now that the version floor allows it is issue
# bitcoin-node-tests#42.
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "check" },
    { include-group = "docs" },
]

[tool.uv]
required-version = ">=0.12.17"

[tool.uv.build-backend]
# `module-name` is not written: it defaults to `project.name` normalized,
# which is `bitcoin_node_tests` already.
source-include = [
    "*.md",
    "*.toml",
    "*.yaml",
    "*.jsonc",
    ".python-version",
    ".secrets.baseline",
    "uv.lock",
    "docs/**",
    "tests/**",
]
source-exclude = [
    "/docs/build",
    "/docs/**/.*",
    "/src/bitcoin_node_tests/**/.*",
    "/tests/**/.*",
    "*.egg-info",
    ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --durations=8 -n auto --dist worksteal --strict-config --strict-markers"
xfail_strict = true
# What one test is given, setup and teardown included, before
# pytest-timeout fails it by name: a hang on a node's process, socket or
# RPC otherwise runs on until the workflow's own `timeout-minutes` ends
# the job with no test named (section 7 of the organization standard).
# Measured on 2026-09-26 against bitcoind 31.1 and the released
# btclib-node at once, on a machine other sessions were loading, under
# `-n auto` and again under `-n 2`:
#
#   TF2_INTEGRATION=1 TF2_BITCOIND=<bitcoind> \
#       TF2_BTCLIB_NODE_PYTHON=<python> \
#       uv run pytest tests/integration --no-cov --durations=15
#
# the slowest were btclib-node tests failing on a `peer.py` wait at its
# default deadline, 34.27s at most, and the slowest passing one was
# `p2p_invalid_locator_bitcoind_test.py::test_max_locator_size`, 18.85s.
# The bound sits far above the defaults `node.py` and `peer.py` give
# their waits, so a missed deadline still fails naming the condition it
# waited on rather than as a timeout; `tests/integration/conftest.py`'s
# own `pytest_configure` scales it by `--timeout-factor` along with them.
timeout = 300
filterwarnings = ["error"]
# --strict-markers is on, so a marker is declared here or it is a typo.
# `integration` is what needs a real node: those tests skip themselves
# without TF2_INTEGRATION in the environment, so the marker is for
# selecting them (`-m integration`) and for excluding them from a run
# that has the variable set for other reasons -- matching btclib's own
# `pyproject.toml`, this tree's own adapter being what starts the node
# rather than the fixture that does there
markers = [
    "integration: needs a real node, opt-in via TF2_INTEGRATION",
]

[tool.codespell]
skip = ".secrets.baseline,uv.lock"
ignore-regex = '`[^`]*`'

[tool.typos.files]
extend-exclude = [".secrets.baseline", "uv.lock"]

[tool.typos.default]
extend-ignore-re = ['[0-9A-Za-z+/]{26,}={0,2}']

[tool.typos.default.extend-identifiers]
# Core's TxOutSer and btclib.coinstats' own tx_out_ser, which typos reads
# as a misspelt "set" and rewrites in place
TxOutSer = "TxOutSer"
tx_out_ser = "tx_out_ser"
# a btclib-node commit's own short sha: its middle characters spell `ded`,
# which typos reads as a misspelt "dead" and rewrites in place
"8ded5494" = "8ded5494"

[tool.typos.type.verbatim]
extend-glob = ["CHANGELOG.md", ".pre-commit-config.yaml", "TF2.md"]
extend-ignore-re = ['`[^`]*`']

[tool.coverage.run]
source = ["bitcoin_node_tests", "tests"]
# tests/integration is omitted because the ratchet measures what an
# ordinary run executes, and those tests skip themselves without
# TF2_INTEGRATION: their bodies would be uncovered lines of tests/ at
# every commit, which is the ratchet reporting the switch rather than a
# defect. What covers them is the opt-in run, and the module docstrings
# carry the command -- matching btclib's own `pyproject.toml`
omit = ["*/site-packages/*", "tests/integration/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 100.0

[tool.mypy]
strict = true
show_column_numbers = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
warn_unreachable = true
python_version = "3.12"
exclude = ["^build/"]

[tool.ruff]
force-exclude = true

[tool.ruff.format]
exclude = ["CHANGELOG.md"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["ALL"]
extend-select = ["unspecified-encoding"]
ignore = [
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "undocumented-magic-method",
    "undocumented-public-init",
    "line-too-long",
    "too-many-arguments",
    "too-many-statements",
    "too-many-positional-arguments",
    "magic-value-comparison",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "f-string-in-exception",
    "dot-format-in-exception",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "boolean-positional-value-in-call",
    "unused-function-argument",
    "unused-method-argument",
    "unused-class-method-argument",
    "unused-static-method-argument",
    "unused-lambda-argument",
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    "runtime-cast-value",
    "invalid-function-name",
    "invalid-argument-name",
    "non-lowercase-variable-in-function",
    "constant-imported-as-non-constant",
    "mixed-case-variable-in-global-scope",
    "try-except-in-loop",
    "any-type",
    "private-member-access",
    # zero-finding for a construct this codebase does not contain
    "DTZ",
    "G",
    "LOG",
    "ASYNC",
    "NPY",
    "EXE",
    "AIR",
    "DJ",
    "FAST",
    "ICN",
    "INT",
    "PD",
    "YTT",
    "invalid-todo-tag",
    "missing-todo-author",
    "missing-todo-link",
    "missing-todo-colon",
    "missing-todo-description",
    "invalid-todo-capitalization",
    "missing-space-after-todo-colon",
]

[tool.ruff.lint.per-file-ignores]
".github/scripts/*.py" = [
    "INP001",
] # entry points a workflow step invokes by path
"docs/source/conf.py" = ["INP001"]
"**/__init__.py" = ["F401"] # re-exported imports
# T20 is selected for the package, which writes to no stream of its own;
# a script whose caller is a workflow step is the case it is not about.
# The vendored-vector checker: BEHIND, SKIPPED and the all-clear line are
# what a weekly run's log says happened, the issue it opens or closes
# being the same report a second way
".github/scripts/check_vendored_vectors.py" = ["T201"]
# the ledger census script: GAINED, REMOVED and the all-clear line are
# the same kind of log, for the directory read rather than the per-pin one
".github/scripts/tf2_ledger_census.py" = ["T201"]
# the master-only verdict: its whole report is what a caller redirects
# into $GITHUB_STEP_SUMMARY, so stdout is the interface and not a log
# beside one
".github/scripts/tf2_master_verdict.py" = ["T201"]
# the node-ran check: its `::error::` lines are workflow commands the
# runner reads from stdout, so printing them is the interface
".github/scripts/check_node_ran.py" = ["T201"]
"tests/**" = [
    "S101",   # assert
    "S311",   # non-cryptographic random: fine in tests
    "B017",   # assert-raises-exception
    "PT011",  # pytest-raises-too-broad
    "PT012",  # pytest-raises-with-multiple-statements
    "PT018",  # pytest-composite-assertion
    "RUF043", # pytest-raises-ambiguous-pattern
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT transcribed: each line with its regex metacharacters
# escaped, joined by a literal \n, and `^(#![^\n]*\n)?` ahead of it for
# the shebang a `language: script` hook's file opens with -- section 5
# of the organization standard, and btclib-org/.github#1294, which is
# where the shebang tolerance landed
notice-rgx = "^(#![^\\n]*\\n)?# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-short-docstrings = true
allow-init-docstring = true
skip-checking-raises = true

[tool.check-sdist]
# tracked files the sdist is meant not to carry. What
# [tool.uv.build-backend] source-exclude would name is not repeated
# here: check-sdist reads that list for the uv backend, so this holds
# only what no include pattern adds in the first place -- the
# workspaces of an editor and of an agent, the file git itself reads,
# and COPYRIGHT, which `project.license-files` does not name (btclib's
# own pyproject.toml carries the identical list for the identical
# reason). check-sdist's own default ignore list already carries
# .github, so it needs no entry here. Patterns are gitignore's, so a
# directory covers what is under it at any depth
git-only = [
    ".claude/",
    ".gitattributes",
    ".vscode/",
    "COPYRIGHT",
]
